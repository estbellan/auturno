
    <div class="error-shell">
      <div class="error-content card-elevated">
        <span class="ms ms--xl" style="color: var(--at-error)">lock</span>
        <div class="error-content__text">
          <p class="type-label-md" style="color: var(--at-error); letter-spacing: 0.05em; text-transform: uppercase;">
            {{ i18n.t('error.accessDenied.label') }}
          </p>
          <h1 class="type-headline-sm" style="margin: 0">{{ i18n.t('error.accessDenied.title') }}</h1>
          <p class="type-body-md" style="margin: 0">{{ i18n.t('error.accessDenied.body') }}</p>
        </div>
        <div class="error-content__actions">
          <a class="btn-filled" routerLink="/">{{ i18n.t('error.accessDenied.goPortal') }}</a>
          @if (defaultPortalUrl(); as url) {
            <a class="btn-outlined" [routerLink]="url">{{ i18n.t('error.accessDenied.goAllowed') }}</a>
          }
        </div>
      </div>
    </div>
